    <style>
        @font-face {
            font-family: 'AzoSans';
            src: url('assets/fonts/AzoSans-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'AzoSansUber';
            src: url('assets/fonts/AzoSansUber-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Lora', serif;
            color: #1a202c;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0050ff 0%, #0040d9 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 80, 255, 0.4);
        }

        .section-padding {
            padding: 5rem 0;
        }

        .hero-gradient {
            background: linear-gradient(135deg, rgba(0, 80, 255, 0.5) 0%, rgba(0, 64, 217, 0.5) 100%);
        }

        /* Image Slider Styles */
        :root {
            --main: #777;
            --back: #aaa;
            --accent: hsl(220, 50%, 40%);
            --base: 3vh;
            --time: 1800ms;
        }

        .slider {
            position: relative;
            height: 100vh;
            width: 100%;
            background: var(--main);
            overflow: hidden;
        }

        .slider__wrap {
            position: absolute;
            width: 100%;
            height: 100vh;
            transform: translateX(100%);
            top: 0%;
            left: 0;
            right: auto;
            overflow: hidden;
            transition: transform calc(var(--time) / 4) cubic-bezier(0.785, 0.135, 0.150, 0.860);
            transform-origin: 0% 50%;
            transition-delay: calc(var(--time) / 4);
            opacity: 0;
        }

        .slider__wrap--hacked {
            opacity: 1;
        }

        .slider__back {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: filter calc(var(--time) / 4) cubic-bezier(0.785, 0.135, 0.150, 0.860);
        }

        .slider__inner {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: scale(0.75);
            transition: transform calc(var(--time) / 4) cubic-bezier(0.785, 0.135, 0.150, 0.860),
                box-shadow calc(var(--time) / 4) cubic-bezier(0.785, 0.135, 0.150, 0.860),
                opacity calc(var(--time) / 4) step-end;
            opacity: 0;
            box-shadow: 0 var(--base) var(--base) rgba(0, 0, 0, 0);
            padding: calc(var(--base) * 5);
            box-sizing: border-box;
        }

        .slider__content {
            position: relative;
            top: 50%;
            width: auto;
            transform: translateY(-50%);
            color: white;
            font-family: 'Heebo', sans-serif;
            opacity: 0;
            transition: opacity calc(var(--time) / 4);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .slider__content h1 {
            font-weight: 900;
            font-size: calc(var(--base) * 4);
            line-height: 0.9;
            margin-bottom: calc(var(--base) / 2);
            pointer-events: none;
            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.4),
                0 4px 8px rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.2),
                0 0 20px rgba(0, 0, 0, 0.15);
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        /* Button Effect Styles */
        @property --angle-1 {
            syntax: "<angle>";
            inherits: false;
            initial-value: -75deg;
        }

        @property --angle-2 {
            syntax: "<angle>";
            inherits: false;
            initial-value: -45deg;
        }

        :root {
            --global--size: clamp(1rem, 2vw, 2.5rem);
            --anim--hover-time: 400ms;
            --anim--hover-ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Button Wrap Container */
        .slider__content .button-wrap {
            position: relative;
            z-index: 2;
            border-radius: 999vw;
            background: transparent;
            pointer-events: none;
            transition: all var(--anim--hover-time) var(--anim--hover-ease);
            margin-top: calc(var(--base) / 2);
            display: inline-block;
            width: auto;
        }

        /* Button Shadow Container */
        .slider__content .button-shadow {
            --shadow-cuttoff-fix: 0.75em;
            position: absolute;
            width: calc(100% + var(--shadow-cuttoff-fix));
            height: calc(100% + var(--shadow-cuttoff-fix));
            top: calc(0% - var(--shadow-cuttoff-fix) / 2);
            left: calc(0% - var(--shadow-cuttoff-fix) / 2);
            filter: blur(clamp(2px, 0.125em, 8px));
            -webkit-filter: blur(clamp(2px, 0.125em, 8px));
            -moz-filter: blur(clamp(2px, 0.125em, 8px));
            -ms-filter: blur(clamp(2px, 0.125em, 8px));
            overflow: visible;
            pointer-events: none;
        }

        /* Shadow */
        .slider__content .button-shadow::after {
            content: "";
            position: absolute;
            z-index: 0;
            inset: 0;
            border-radius: 999vw;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.2));
            width: calc(100% - var(--shadow-cuttoff-fix) - 0.15em);
            height: calc(100% - var(--shadow-cuttoff-fix) - 0.15em);
            top: calc(var(--shadow-cuttoff-fix) - 0.25em);
            left: calc(var(--shadow-cuttoff-fix) - 0.4em);
            padding: 0.1em;
            box-sizing: border-box;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            transition: all var(--anim--hover-time) var(--anim--hover-ease);
            overflow: visible;
            opacity: 1;
        }

        /* Button Base Styles - Enhanced for both button and anchor */
        .slider__content .button-wrap button,
        .slider__content .button-wrap a.go-to-next {
            --border-width: clamp(1px, 0.0625em, 4px);
            all: unset;
            cursor: pointer;
            position: relative;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            pointer-events: auto;
            z-index: 3;
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(-75deg,
                    rgba(255, 255, 255, 0.15),
                    rgba(255, 255, 255, 0.35),
                    rgba(255, 255, 255, 0.15));
            border-radius: 999vw;
            box-shadow: inset 0 0.125em 0.125em rgba(0, 0, 0, 0.1),
                inset 0 -0.125em 0.125em rgba(255, 255, 255, 0.4),
                0 0.25em 0.125em -0.125em rgba(0, 0, 0, 0.3),
                0 0 0.1em 0.25em inset rgba(255, 255, 255, 0.3),
                0 0 0.5em rgba(255, 255, 255, 0.2),
                0 0 0 0 rgba(255, 255, 255, 1);
            backdrop-filter: blur(clamp(2px, 0.15em, 6px));
            -webkit-backdrop-filter: blur(clamp(2px, 0.15em, 6px));
            -moz-backdrop-filter: blur(clamp(2px, 0.15em, 6px));
            -ms-backdrop-filter: blur(clamp(2px, 0.15em, 6px));
            transition: all var(--anim--hover-time) var(--anim--hover-ease);
        }

        .slider__content .button-wrap button:hover,
        .slider__content .button-wrap a.go-to-next:hover {
            transform: scale(0.98) translateY(-2px);
            backdrop-filter: blur(0.01em);
            -webkit-backdrop-filter: blur(0.01em);
            -moz-backdrop-filter: blur(0.01em);
            -ms-backdrop-filter: blur(0.01em);
            box-shadow: inset 0 0.125em 0.125em rgba(0, 0, 0, 0.1),
                inset 0 -0.125em 0.125em rgba(255, 255, 255, 0.5),
                0 0.3em 0.15em -0.1em rgba(0, 0, 0, 0.4),
                0 0 0.1em 0.15em inset rgba(255, 255, 255, 0.5),
                0 0 0.8em rgba(255, 255, 255, 0.3),
                0 0 0 0 rgba(255, 255, 255, 1);
        }

        /* Button Text - Enhanced */
        .slider__content .button-wrap button span,
        .slider__content .button-wrap a.go-to-next span {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            font-family: 'Heebo', sans-serif;
            letter-spacing: calc(var(--base) * 0.12);
            font-weight: 600;
            font-size: calc(var(--base) * 0.85);
            color: rgba(255, 255, 255, 1);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-shadow: 0em 0.25em 0.05em rgba(0, 0, 0, 0.4),
                0 0 10px rgba(255, 255, 255, 0.3);
            transition: all var(--anim--hover-time) var(--anim--hover-ease);
            padding-inline: 1.75em;
            padding-block: 1em;
        }

        /* Arrow icon after text */
        .slider__content .button-wrap button span::before,
        .slider__content .button-wrap a.go-to-next span::before {
            content: "→";
            display: inline-block;
            font-size: 1.2em;
            transition: transform var(--anim--hover-time) var(--anim--hover-ease);
            opacity: 0.9;
        }

        .slider__content .button-wrap button:hover span,
        .slider__content .button-wrap a.go-to-next:hover span {
            text-shadow: 0.025em 0.025em 0.025em rgba(0, 0, 0, 0.2),
                0 0 15px rgba(255, 255, 255, 0.5);
        }

        .slider__content .button-wrap button:hover span::before,
        .slider__content .button-wrap a.go-to-next:hover span::before {
            transform: translateX(0.3em);
            opacity: 1;
        }

        /* Text Shine Effect - Enhanced */
        .slider__content .button-wrap button span::after,
        .slider__content .button-wrap a.go-to-next span::after {
            content: "";
            display: block;
            position: absolute;
            z-index: 1;
            width: calc(100% - var(--border-width));
            height: calc(100% - var(--border-width));
            top: calc(0% + var(--border-width) / 2);
            left: calc(0% + var(--border-width) / 2);
            box-sizing: border-box;
            border-radius: 999vw;
            overflow: clip;
            background: linear-gradient(var(--angle-2),
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.7) 40% 50%,
                    rgba(255, 255, 255, 0) 55%);
            z-index: 3;
            mix-blend-mode: screen;
            pointer-events: none;
            background-size: 200% 200%;
            background-position: 0% 50%;
            background-repeat: no-repeat;
            transition: background-position calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease),
                --angle-2 calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease);
        }

        .slider__content .button-wrap button:hover span::after,
        .slider__content .button-wrap a.go-to-next:hover span::after {
            background-position: 30% 50%;
        }

        .slider__content .button-wrap button:active span::after,
        .slider__content .button-wrap a.go-to-next:active span::after {
            background-position: 50% 15%;
            --angle-2: -15deg;
        }

        /* Touch Devices */
        @media (hover: none) and (pointer: coarse) {

            .slider__content .button-wrap button span::after,
            .slider__content .button-wrap button:active span::after,
            .slider__content .button-wrap a.go-to-next span::after,
            .slider__content .button-wrap a.go-to-next:active span::after {
                --angle-2: -45deg;
            }
        }

        /* Button Outline - Enhanced */
        .slider__content .button-wrap button::after,
        .slider__content .button-wrap a.go-to-next::after {
            content: "";
            position: absolute;
            z-index: 1;
            inset: 0;
            border-radius: 999vw;
            width: calc(100% + var(--border-width));
            height: calc(100% + var(--border-width));
            top: calc(0% - var(--border-width) / 2);
            left: calc(0% - var(--border-width) / 2);
            padding: var(--border-width);
            box-sizing: border-box;
            background: conic-gradient(from var(--angle-1) at 50% 50%,
                    rgba(255, 255, 255, 0.6),
                    rgba(255, 255, 255, 0) 5% 40%,
                    rgba(255, 255, 255, 0.6) 50%,
                    rgba(255, 255, 255, 0) 60% 95%,
                    rgba(255, 255, 255, 0.6)),
                linear-gradient(180deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4));
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            transition: all var(--anim--hover-time) var(--anim--hover-ease),
                --angle-1 500ms ease;
            box-shadow: inset 0 0 0 calc(var(--border-width) / 2) rgba(255, 255, 255, 0.4);
        }

        .slider__content .button-wrap button:hover::after,
        .slider__content .button-wrap a.go-to-next:hover::after {
            --angle-1: -125deg;
        }

        .slider__content .button-wrap button:active::after,
        .slider__content .button-wrap a.go-to-next:active::after {
            --angle-1: -75deg;
        }

        @media (hover: none) and (pointer: coarse) {

            .slider__content .button-wrap button::after,
            .slider__content .button-wrap button:hover::after,
            .slider__content .button-wrap button:active::after,
            .slider__content .button-wrap a.go-to-next::after,
            .slider__content .button-wrap a.go-to-next:hover::after,
            .slider__content .button-wrap a.go-to-next:active::after {
                --angle-1: -75deg;
            }
        }

        /* Shadow Hover - Enhanced */
        .slider__content .button-wrap:has(button:hover) .button-shadow,
        .slider__content .button-wrap:has(a.go-to-next:hover) .button-shadow {
            filter: blur(clamp(3px, 0.08em, 8px));
            -webkit-filter: blur(clamp(3px, 0.08em, 8px));
            -moz-filter: blur(clamp(3px, 0.08em, 8px));
            -ms-filter: blur(clamp(3px, 0.08em, 8px));
            transition: filter var(--anim--hover-time) var(--anim--hover-ease);
        }

        .slider__content .button-wrap:has(button:hover) .button-shadow::after,
        .slider__content .button-wrap:has(a.go-to-next:hover) .button-shadow::after {
            top: calc(var(--shadow-cuttoff-fix) - 0.5em);
            opacity: 1;
        }

        /* Rotation - Enhanced */
        .slider__content .button-wrap:has(button:active),
        .slider__content .button-wrap:has(a.go-to-next:active) {
            transform: rotate3d(1, 0, 0, 25deg);
        }

        .slider__content .button-wrap:has(button:active) button,
        .slider__content .button-wrap:has(a.go-to-next:active) a.go-to-next {
            box-shadow: inset 0 0.125em 0.125em rgba(0, 0, 0, 0.1),
                inset 0 -0.125em 0.125em rgba(255, 255, 255, 0.4),
                0 0.125em 0.125em -0.125em rgba(0, 0, 0, 0.3),
                0 0 0.1em 0.25em inset rgba(255, 255, 255, 0.2),
                0 0.225em 0.05em 0 rgba(0, 0, 0, 0.1),
                0 0.25em 0 0 rgba(255, 255, 255, 0.5),
                inset 0 0.25em 0.05em 0 rgba(0, 0, 0, 0.2);
        }

        .slider__content .button-wrap:has(button:active) .button-shadow,
        .slider__content .button-wrap:has(a.go-to-next:active) .button-shadow {
            filter: blur(clamp(3px, 0.15em, 14px));
            -webkit-filter: blur(clamp(3px, 0.15em, 14px));
            -moz-filter: blur(clamp(3px, 0.15em, 14px));
            -ms-filter: blur(clamp(3px, 0.15em, 14px));
        }

        .slider__content .button-wrap:has(button:active) .button-shadow::after,
        .slider__content .button-wrap:has(a.go-to-next:active) .button-shadow::after {
            top: calc(var(--shadow-cuttoff-fix) - 0.3em);
            opacity: 0.8;
        }

        .slider__content .button-wrap:has(button:active) span,
        .slider__content .button-wrap:has(a.go-to-next:active) span {
            text-shadow: 0.025em 0.25em 0.05em rgba(0, 0, 0, 0.2);
        }

        .slider__slide {
            position: absolute;
            left: 0;
            height: 100vh;
            width: 100%;
            transition: transform calc(var(--time) / 3) cubic-bezier(0.785, 0.135, 0.150, 0.860);
            transition-delay: calc(var(--time) / 3);
            pointer-events: none;
            z-index: 0;
        }

        .slider__slide--active {
            transform: translateX(0%);
            z-index: 2;
        }

        .slider__slide--active .slider__wrap {
            transform: translateX(0);
            transform-origin: 100% 50%;
            opacity: 1;
            animation: none;
        }

        .slider__slide--active .slider__back {
            filter: blur(calc(var(--base) * 0.5));
            transition: filter calc(var(--time) / 2) cubic-bezier(0.785, 0.135, 0.150, 0.860);
            transition-delay: calc(var(--time) / 2) !important;
        }

        .slider__slide--active .slider__inner {
            transform: scale(0.80);
            box-shadow: 0 calc(var(--base) / 3) calc(var(--base) * 2) rgba(0, 0, 0, 0.2);
            pointer-events: auto;
            opacity: 1;
            transition: transform calc(var(--time) / 2) cubic-bezier(0.785, 0.135, 0.150, 0.860),
                box-shadow calc(var(--time) / 2) cubic-bezier(0.785, 0.135, 0.150, 0.860),
                opacity 1ms step-end;
            transition-delay: calc(var(--time) / 2);
        }

        .slider__slide--active .slider__content {
            opacity: 1;
            transition-delay: calc(var(--time) * 3 / 4);
        }

        .slider__slide:not(.slider__slide--active) .slider__wrap {
            animation-name: hack;
            animation-duration: calc(var(--time) / 2);
            animation-delay: calc(var(--time) / 4);
            animation-timing-function: cubic-bezier(0.785, 0.135, 0.150, 0.860);
        }

        @keyframes hack {
            0% {
                transform: translateX(0);
                opacity: 1;
            }

            50% {
                transform: translateX(-100%);
                opacity: 1;
            }

            51% {
                transform: translateX(-100%);
                opacity: 0;
            }

            52% {
                transform: translateX(100%);
                opacity: 0;
            }

            100% {
                transform: translateX(100%);
                opacity: 1;
            }
        }

        .slider__slide:nth-child(1) .slider__back,
        .slider__slide:nth-child(1) .slider__inner {
            background-image: url('assets/images/about/casestudies/img1.jpg');
        }

        .slider__slide:nth-child(2) .slider__back,
        .slider__slide:nth-child(2) .slider__inner {
            background-image: url('assets/images/about/casestudies/img2.jpg');
        }

        .slider__slide:nth-child(3) .slider__back,
        .slider__slide:nth-child(3) .slider__inner {
            background-image: url('assets/images/about/casestudies/img3.jpg');
        }

        .slider__slide:nth-child(4) .slider__back,
        .slider__slide:nth-child(4) .slider__inner {
            background-image: url('assets/images/about/casestudies/img4.jpg');
        }

        .slider__indicators {
            position: absolute;
            bottom: calc(var(--base) * 2);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: calc(var(--base) * 0.5);
            z-index: 10;
        }

        .slider__indicator {
            width: calc(var(--base) * 0.8);
            height: calc(var(--base) * 0.8);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .slider__indicator:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .slider__slide--active~.slider__indicators .slider__indicator[data-slide="1"],
        .slider__slide[data-slide="1"].slider__slide--active~.slider__indicators .slider__indicator[data-slide="1"] {
            background: rgba(255, 255, 255, 0.9);
        }

        /* Navigation Arrows */
        .slider__arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;

    <script>
        // Image Slider JavaScript
        document.addEventListener('DOMContentLoaded', function () {
            const slides = document.querySelectorAll('.slider__slide');
            const indicatorsContainer = document.querySelector('.slider__indicators');

            // Create indicators
            slides.forEach(function (slide, index) {
                const indicator = document.createElement('div');
                indicator.className = 'slider__indicator';
                indicator.setAttribute('data-slide', index + 1);
                indicatorsContainer.appendChild(indicator);

                // Add click event to indicator
                indicator.addEventListener('click', function () {
                    goToSlide(index + 1);
                });
            });

            // Add hacked class after delay
            setTimeout(function () {
                const wraps = document.querySelectorAll('.slider__wrap');
                wraps.forEach(function (wrap) {
                    wrap.classList.add('slider__wrap--hacked');
                });
            }, 1000);

            // Go to slide function
            function goToSlide(number) {
                slides.forEach(function (slide) {
                    slide.classList.remove('slider__slide--active');
                });
                const targetSlide = document.querySelector('.slider__slide[data-slide="' + number + '"]');
                if (targetSlide) {
                    targetSlide.classList.add('slider__slide--active');
                }

                // Update active indicator
                const indicators = document.querySelectorAll('.slider__indicator');
                indicators.forEach(function (indicator) {
                    indicator.style.background = 'rgba(255, 255, 255, 0.3)';
                });
                const activeIndicator = document.querySelector('.slider__indicator[data-slide="' + number + '"]');
                if (activeIndicator) {
                    activeIndicator.style.background = 'rgba(255, 255, 255, 0.9)';
                }
            }

            // Next slide function
            function goToNext() {
                const activeSlide = document.querySelector('.slider__slide--active');
                if (activeSlide) {
                    const currentSlide = Number(activeSlide.getAttribute('data-slide'));
                    const totalSlides = slides.length;
                    let nextSlide = currentSlide + 1;
                    if (nextSlide > totalSlides) {
                        nextSlide = 1;
                    }
                    goToSlide(nextSlide);
                }
            }

            // Previous slide function
            function goToPrev() {
                const activeSlide = document.querySelector('.slider__slide--active');
                if (activeSlide) {
                    const currentSlide = Number(activeSlide.getAttribute('data-slide'));
                    const totalSlides = slides.length;
                    let prevSlide = currentSlide - 1;
                    if (prevSlide < 1) {
                        prevSlide = totalSlides;
                    }
                    goToSlide(prevSlide);
                }
            }

            // Arrow navigation event listeners (will be set up after auto-play functions are defined)
            const prevArrow = document.getElementById('slider-prev');
            const nextArrow = document.getElementById('slider-next');

            // Add click event to next buttons
            // Only prevent default for buttons, allow anchor tags to navigate
            const nextButtons = document.querySelectorAll('.go-to-next, .slider__next');
            nextButtons.forEach(function (button) {
                button.addEventListener('click', function (e) {
                    // Only prevent default if it's a button, not an anchor tag
                    if (button.tagName === 'BUTTON' || button.classList.contains('slider__next')) {
                        e.preventDefault();
                        goToNext();
                    }
                    // Anchor tags will navigate naturally
                });
            });

            // Initialize active indicator
            const firstIndicator = document.querySelector('.slider__indicator[data-slide="1"]');
            if (firstIndicator) {
                firstIndicator.style.background = 'rgba(255, 255, 255, 0.9)';
            }

            // Auto-play carousel - always runs every 5 seconds
            let autoPlayInterval;

            function startAutoPlay() {
                // Clear any existing interval first to prevent multiple intervals
                if (autoPlayInterval) {
                    clearInterval(autoPlayInterval);
                }

                autoPlayInterval = setInterval(function () {
                    goToNext();
                }, 5000); // Change slide every 5 seconds

                console.log('Auto-play started - slides every 5 seconds');
            }

            // Start auto-play immediately
            startAutoPlay();

            // Note: Arrow and indicator clicks still work, but don't pause auto-play
            // The carousel will continue to auto-advance every 5 seconds
        });
    </script>
