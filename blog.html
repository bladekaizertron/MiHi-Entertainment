<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Blog - MiHi Entertainment</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        @font-face {
            font-family: 'AzoSansUber';
            src: url('assets/fonts/AzoSansUber-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'AzoSans';
            src: url('assets/fonts/AzoSans-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #1a202c;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Playfair Display', serif;
        }

        .hero-h1 {
            font-family: 'AzoSansUber', sans-serif;
        }

        .hero-p {
            font-family: 'AzoSans', sans-serif;
        }

        .blogs-h2 {
            font-family: 'AzoSansUber', sans-serif;
            color: #FF4F4F;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0050ff 0%, #0040d9 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 80, 255, 0.4);
        }

        .section-padding {
            padding: 5rem 0;
        }

        .hero-gradient {
            background: linear-gradient(135deg, rgba(0, 80, 255, 0.5) 0%, rgba(0, 64, 217, 0.5) 100%);
        }

        .blog-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .blog-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div id="nav-placeholder"></div>

    <!-- Blog Hero Section -->
    <section class="relative h-[60vh] flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('assets/images/blogs/hero.jpg');">
        </div>
        <div class="absolute inset-0 bg-black opacity-50"></div>
        <div class="relative z-10 text-center text-white px-6">
            <h1 class="hero-h1 text-5xl md:text-6xl font-bold mb-4"><span style="color: #FF4F4F;">MIHI</span> <span
                    style="color: #18F1E1;">BLOGS</span></h1>
            <p class="hero-p text-xl md:text-2xl mb-8">Discover the latest trends and insights in the world of event
                entertainment with MiHi Entertainment's blog.</p>
        </div>
    </section>

    <!-- MIHI BLOGS SECTION -->
    <section class="section-padding bg-white">
        <div class="container mx-auto px-6">
            <h2 class="blogs-h2 text-3xl md:text-4xl font-normal uppercase">ALL MIHI ENTERTAINMENT BLOGS</h2>
        </div>
    </section>

    <script src="../assets/components/navigation.js"></script>
    <script src="../assets/components/footer.js"></script>
    <!-- Load Back to Top Component -->
    <script src="assets/components/back-to-top.js"></script>

</body>
